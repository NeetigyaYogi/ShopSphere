

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopSphere - online shopping</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav> 
        <a href="index.html" >Home</a>
        <a href="products.html" >Products</a>
        <a href="about.html" >About</a>
        <a href="contact.html" >Contact</a>
    </nav>
  </header>
  <main>
    <section class="hero">
    <h2>Elevate Your Everyday</h2>
    <p>Discover thoughtfully curated essentials designed for modern living.</p>
    <button id="shopButton">Explore Collection</button>
    <p id="message"></p>
    </section>
    <section class="categories">
      <h2>Shop by Category</h2>
      <p>Explore our curated collections.</p>
      <div class="category-grid">
        <div class="category-card">
          <img src="images/fashion.jpg" alt="Premium clothing collection">
          <h3>Fashion</h3>
        </div>
        <div class="category-card">
          <img src="images/electronics.jpg" alt="Premium electronics collectionS">
          <h3>Electronics</h3>
        </div>
        <div class="category-card">
          <img src="images/home-living.jpg" alt="Premium Home & living collection">
          <h3>Home & Living</h3>
        </div>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
